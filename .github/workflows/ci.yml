name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is experimental until its engine build lands green once:
    # remove this line after the first fully green Windows run.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri v2 system deps (webkit2gtk/appindicator/rsvg) plus what this
          # crate adds on top: ALSA for cpal, gtk-layer-shell for the overlay,
          # X11 libs for enigo (XTEST/X11/Xrandr), OpenBLAS headers for the
          # whisper wrapper, and Vulkan headers + glslc so transcribe-cpp-sys
          # can build ggml's Vulkan backend (the Linux `vulkan` feature).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libxtst-dev libx11-dev libxrandr-dev libopenblas-dev \
            libvulkan-dev glslc spirv-headers

      # Mirrors upstream Handy's proven Windows recipe: long paths enabled,
      # then the exact Vulkan SDK version their CI pins. Newer SDK versions
      # (tested: 1.4.363.0 via latest) fail CMake's FindVulkan on runners.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # The pinned SDK ships Vulkan headers but not the SPIRV-Headers CMake
      # package config that ggml-vulkan's find_package requires. Build and
      # install KhronosGroup/SPIRV-Headers into a prefix, then point the
      # transcribe-cpp-sys cmake build at it. Note the org is KhronosGroup
      # (a wrong org makes github prompt for auth instead of erroring).
      - name: Checkout SPIRV-Headers (Windows)
        if: runner.os == 'Windows'
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: vulkan-sdk-1.4.341.0
          path: spirv-headers-src

      - name: Install SPIRV-Headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # pwsh exits with only the last command's status, so a failed
        # non-final cmake would be swallowed; guard each command instead.
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'spirv-install'
          cmake -S spirv-headers-src -B spirv-headers-build "-DCMAKE_INSTALL_PREFIX=$prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build spirv-headers-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install spirv-headers-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TRANSCRIBE_CMAKE_ARGS=-DCMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # cargo test above regenerated src/bindings.ts via the export_bindings
      # test; fail when the committed bindings are stale. macOS-gated so
      # cross-OS line endings can never false-positive: Windows checkouts
      # may rewrite EOLs (autocrlf), failing this diff without any content
      # change, and no trivially correct cross-platform form exists.
      - name: Bindings freshness (tauri-specta)
        if: runner.os == 'macOS'
        run: git diff --exit-code src/bindings.ts

      - name: Lint frontend
        run: bun run lint

      - name: Typecheck frontend
        run: bunx tsc --noEmit -p tsconfig.json

      # tsc --noEmit alone accepts rollup/vite-level failures (asset imports,
      # the second overlay entry point); build both bundles in CI so they
      # surface here, not at release time.
      - name: Build frontend
        run: bun run build

      - name: Test accent palette
        run: bun run test:accent

      # KB-136 pattern: package.json grew test:* scripts and assert-only
      # *.test.ts files faster than this workflow, so tests existed that CI
      # never executed. Run every bun unit-test script plus the five
      # assert files that have no script of their own; the last line is
      # scripts/ciTestCoverage.test.ts, which fails the build when a new
      # test:* script or assert file is added without a CI invocation.
      - name: Run bun unit tests
        # Chained so any command's failure fails the step: the default
        # shell on Windows is pwsh, which exits with only the last
        # command's status (bash -e already propagates per command).
        run: |
          bun run test:keyboard &&
          bun run test:notice &&
          bun run test:settings &&
          bun run test:onboarding &&
          bun run test:updater &&
          bun src/components/settings/commands/commandGroups.test.ts &&
          bun src/components/settings/post-processing/skipToastDedupe.test.ts &&
          bun src/components/settings/historyLimitInput.test.ts &&
          bun docs/quality-goldmine.test.ts &&
          bun ui-shots/shoot.test.ts &&
          bun scripts/ciTestCoverage.test.ts

      # Belt and suspenders: the sweep runs every src/**/*.test.ts it can
      # discover (tracked or untracked-but-not-ignored) directly, so a file
      # added with neither a script nor a list entry above still executes.
      - name: Test frontend sweep
        run: bun run test:frontend

      # The release pipeline runs only at operator release time; keep its
      # scripts at least syntactically honest in CI (fleet KB-233: the smoke
      # step shipped unrunnable because nothing checked it).
      # Skipped on Windows: an autocrlf checkout rewrites these scripts to
      # CRLF and bash -n then fails on the \r line endings, a checkout
      # artifact rather than a script regression (the same EOL
      # false-positive class the bindings freshness step gates away).
      - name: Release scripts syntax gate
        if: runner.os != 'Windows'
        # Chained so any command's failure fails the step even under a
        # shell without bash -e semantics.
        run: |
          # The AI build-integrity gate must stay in the release pipeline:
          # without the FoundationModels greps below the gate could be
          # dropped in a refactor and a stub-linked app would ship again.
          bash -n scripts/release-macos.sh &&
          bash -n scripts/smoke-macos.sh &&
          grep -q 'APP_NAME="voxbar"' scripts/smoke-macos.sh &&
          grep -q 'FoundationModels.framework' scripts/release-macos.sh &&
          grep -q 'Building Apple Intelligence with stubs' scripts/release-macos.sh &&
          grep -q 'Apple Intelligence SDK not found' scripts/release-macos.sh

      - name: Check translations
        run: bun run check:translations
