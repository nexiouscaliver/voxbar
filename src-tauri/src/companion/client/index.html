<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101014" />
    <title>VoxBar Companion</title>
    <style>
      :root {
        --bg: #101014;
        --card: #1a1a20;
        --card-2: #22222a;
        --text: #f2f2f5;
        --muted: #9a9aa5;
        --accent: #7c3aed;
        --accent-2: #9d86ff;
        --rec: #e5484d;
        --ok: #15803d;
        --warn: #f5a524;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: max(20px, env(safe-area-inset-top)) 20px
          calc(env(safe-area-inset-bottom) + 28px);
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      /* 44pt minimum touch targets at an unchanged visual size: every
         button (the ptt circle is already far larger) carries an invisible
         pseudo-element band, so the hit area is at least 44px tall while
         the painted control stays compact. Vertical-only slop: the
         segments sit side by side, so horizontal extension would let one
         segment steal its neighbor's taps. */
      button:not(#ptt) {
        position: relative;
      }
      button:not(#ptt)::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 44px;
        transform: translateY(-50%);
      }
      header {
        text-align: center;
        margin: 8px 0 4px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
        letter-spacing: 0.2px;
      }
      .sub {
        color: var(--muted);
        font-size: 14px;
        max-width: 300px;
        margin: 0 auto;
      }
      #state {
        margin: 18px 0 6px;
        padding: 7px 16px;
        border-radius: 999px;
        background: var(--card-2);
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #state .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
      }
      #state.recording {
        color: #fff;
        background: rgba(229, 72, 77, 0.22);
      }
      #state.recording .dot {
        background: var(--rec);
        animation: pulse 1.1s infinite;
      }
      #state.ready .dot {
        background: var(--ok);
      }
      #state.warn .dot {
        background: var(--warn);
      }
      #state.warn {
        color: #ffd9a0;
        background: rgba(245, 165, 36, 0.16);
      }
      /* A pairing failure must read stronger than a plain disconnect: the
         error pill carries the recording red at a steady (non-pulsing)
         dot, tinted background, and warm text. */
      #state.error {
        color: #ffb4b8;
        background: rgba(229, 72, 77, 0.22);
      }
      #state.error .dot {
        background: var(--rec);
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      #ptt {
        margin-top: 22px;
        width: min(72vw, 260px);
        height: min(72vw, 260px);
        border-radius: 50%;
        border: none;
        background: radial-gradient(
          circle at 32% 28%,
          var(--accent-2),
          var(--accent) 65%
        );
        color: #fff;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.2px;
        box-shadow:
          0 14px 40px rgba(124, 58, 237, 0.35),
          inset 0 2px 6px rgba(255, 255, 255, 0.25);
        transition:
          transform 90ms ease,
          box-shadow 120ms ease,
          filter 120ms ease;
      }
      #ptt:active,
      #ptt.held {
        transform: scale(0.96);
        filter: brightness(1.12);
        box-shadow:
          0 8px 24px rgba(124, 92, 255, 0.5),
          inset 0 2px 6px rgba(255, 255, 255, 0.3);
      }
      #ptt.recording {
        background: radial-gradient(circle at 32% 28%, #ff6b6f, var(--rec) 65%);
        box-shadow:
          0 14px 40px rgba(229, 72, 77, 0.4),
          inset 0 2px 6px rgba(255, 255, 255, 0.25);
        animation: pulse 1.4s infinite;
      }
      #ptt:disabled {
        filter: grayscale(0.7) brightness(0.7);
        box-shadow: none;
      }
      /* Mic-blocked: the button stays tappable (its next press retries the
         microphone) but drops to a subdued desaturated amber so the page
         never shows a vivid "talk" control above a microphone failure. */
      #ptt.mic-blocked {
        background: radial-gradient(
          circle at 32% 28%,
          #7a6b4a,
          #4a4028 65%
        );
        box-shadow:
          0 10px 26px rgba(0, 0, 0, 0.4),
          inset 0 2px 6px rgba(255, 255, 255, 0.12);
        padding: 0 20px;
        font-size: 17px;
      }
      #ptt.mic-blocked:active,
      #ptt.mic-blocked.held {
        filter: brightness(1.08);
      }
      #hint {
        color: var(--muted);
        font-size: 13px;
        margin-top: 14px;
        text-align: center;
        max-width: 320px;
        min-height: 18px;
      }
      /* Pairing failures render their message as a red-tinted banner (the
         same card treatment the mic-error banner uses, in the error tone)
         instead of bare caption text. */
      #hint.error-banner {
        background: var(--card);
        border: 1px solid rgba(229, 72, 77, 0.4);
        border-radius: 12px;
        padding: 12px 14px;
        color: #ffb4b8;
        font-size: 14px;
      }
      #notice {
        margin-top: 10px;
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 14px;
        color: var(--text);
        display: none;
        max-width: 340px;
        text-align: center;
      }
      #notice.show {
        display: block;
      }
      .card {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 14px;
        width: min(88vw, 360px);
        font-size: 14px;
      }
      .card-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      #micError {
        margin-top: 12px;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
        border-color: rgba(245, 165, 36, 0.35);
      }
      #micError.show {
        display: flex;
      }
      #micError p {
        margin: 0;
        color: var(--warn);
        font-size: 14px;
      }
      #controls {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .ctl-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .ctl-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      .seg {
        display: flex;
        background: var(--card-2);
        border-radius: 10px;
        padding: 3px;
        gap: 3px;
      }
      .seg button {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        padding: 7px 12px;
        border-radius: 8px;
      }
      .seg button.active {
        background: var(--accent);
        color: #fff;
      }
      .seg button:disabled {
        opacity: 0.45;
      }
      /* The whole controls card dims while the socket is down: the
         segmented control and the Polish switch change nothing until the
         phone reconnects, so they must not look live. */
      #controls.offline {
        opacity: 0.55;
      }
      .switch {
        width: 48px;
        height: 28px;
        border-radius: 999px;
        border: 1px solid #4a4a56;
        background: #3a3a44;
        position: relative;
        padding: 0;
        flex-shrink: 0;
        transition: background 120ms ease;
      }
      /* Keyboard focus ring for every interactive control (segments,
         switch, copy buttons): visible only for focus-visible, in the
         lighter accent so it reads on the dark palette. */
      button:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
      }
      .switch:disabled {
        opacity: 0.45;
      }
      .switch .knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--muted);
        transition:
          transform 120ms ease,
          background 120ms ease;
      }
      .switch.on {
        background: var(--accent);
      }
      .switch.on .knob {
        transform: translateX(20px);
        background: #fff;
      }
      #result {
        margin-top: 18px;
        display: none;
      }
      #result.show {
        display: block;
      }
      .result-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        min-width: 0;
      }
      #resultBadge {
        background: rgba(124, 58, 237, 0.25);
        color: var(--accent-2);
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        flex-shrink: 0;
      }
      #resultModel {
        /* Footnote under the transcript text: full width, no ellipsis
           squeeze against the Copy button. */
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      #resultCopy {
        margin-left: auto;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        padding: 8px 16px;
        flex-shrink: 0;
      }
      #resultCopy.copied {
        background: var(--ok);
      }
      #resultText {
        user-select: text;
        -webkit-user-select: text;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 15px;
        line-height: 1.5;
        max-height: 32vh;
        overflow-y: auto;
      }
      #recent {
        margin-top: 18px;
        display: none;
      }
      #recent.show {
        display: block;
      }
      #recentList {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .recent-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .recent-body {
        flex: 1;
        min-width: 0;
      }
      .recent-text {
        user-select: text;
        -webkit-user-select: text;
        font-size: 13px;
        line-height: 1.4;
        color: var(--text);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .recent-time {
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .copy-mini {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: var(--card-2);
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        border-radius: 8px;
        padding: 6px 10px;
        flex-shrink: 0;
      }
      .copy-mini.copied {
        background: var(--ok);
        border-color: var(--ok);
      }
      .linkrow {
        margin-top: auto;
        padding-top: 18px;
        padding-bottom: 14px;
      }
      button.secondary {
        background: var(--card-2);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 15px;
        font-weight: 600;
      }
      /* Reconnect is THE recovery action of a dead pairing: the filled
         accent primary, clearly separated from the certificate footnote
         below it, not a low-emphasis ghost sibling. */
      #reconnect {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 26px;
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 8px 22px rgba(124, 58, 237, 0.35);
      }
      #reconnect:active {
        filter: brightness(1.12);
      }
      /* Recording feedback row: level bar + elapsed timer, shown only
         while the Mac reports a live session. */
      #meterRow {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 16px;
      }
      #meterRow.show {
        display: flex;
      }
      #micbar {
        width: min(70vw, 260px);
        height: 4px;
        border-radius: 4px;
        background: var(--card-2);
        overflow: hidden;
      }
      #micbar .lvl {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 80ms linear;
      }
      #recTimer {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        min-width: 32px;
      }
      /* Captured but NOT transmitted: the bar reads empty and dim, never
         a lively meter over audio nobody receives (v1.6.3 meter honesty). */
      #micbar .lvl.dim {
        opacity: 0.35;
      }
      #micbar.show {
        display: block;
      }
      .cert {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
        max-width: 330px;
        text-align: center;
      }
      /* Scroll-continuation hint: while content extends below the fold the
         bottom edge of the viewport carries a soft fade into the page
         background, so a list cut at the fold reads as scrollable rather
         than sliced. It disappears at the very bottom so the last row is
         never permanently faded. */
      #scrollFade {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        /* 48px, not 72px: a tall gradient swallowed the static footnote's
           last line whenever the page overflowed the fold by a few pixels
           (the mic-error state). A shallower band only shades content that
           is genuinely cut. */
        height: 48px;
        background: linear-gradient(
          to bottom,
          rgba(16, 16, 20, 0),
          var(--bg) 92%
        );
        pointer-events: none;
        opacity: 0;
        transition: opacity 250ms ease;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="t-title">VoxBar Companion</h1>
      <p class="sub" id="t-subtitle">
        Your phone is now a microphone and trigger for your Mac.
      </p>
    </header>

    <div id="state"><span class="dot"></span><span id="stateText"></span></div>
    <!-- The recording meter: the level bar plus a monospaced elapsed
         timer, so the unlabeled purple bar alone never has to say "live
         session in progress". -->
    <div id="meterRow">
      <div id="micbar"><div class="lvl"></div></div>
      <span id="recTimer" aria-hidden="true"></span>
    </div>

    <button id="ptt" disabled aria-live="polite"></button>
    <div id="hint"></div>
    <div id="notice" role="status"></div>

    <div id="micError" class="card" role="alert">
      <p id="micErrorMsg"></p>
      <button class="secondary" id="micRetry"></button>
    </div>

    <section id="controls" class="card">
      <div class="ctl-row">
        <span class="ctl-label" id="t-target-label"></span>
        <div class="seg" id="targetSeg">
          <button type="button" id="tgtPc"></button>
          <button type="button" id="tgtPhone"></button>
        </div>
      </div>
      <div class="ctl-row">
        <span class="ctl-label" id="t-pp-label"></span>
        <button
          type="button"
          id="ppToggle"
          class="switch"
          role="switch"
          aria-labelledby="t-pp-label"
        >
          <span class="knob"></span>
        </button>
      </div>
    </section>

    <section id="result" class="card">
      <!-- Header keeps three elements, not four: the model tag used to sit
           between the badge and Copy, where the 390pt row over-subscribed
           and truncated it to "Canary 1...". It lives as a full-width
           footnote under the transcript text now. -->
      <div class="result-head">
        <span class="card-title" id="t-result-title"></span>
        <span id="resultBadge"></span>
        <button type="button" id="resultCopy"></button>
      </div>
      <div id="resultText"></div>
      <p id="resultModel"></p>
    </section>

    <section id="recent" class="card">
      <span class="card-title" id="t-history-title"></span>
      <ul id="recentList"></ul>
      <p id="recentEmpty"></p>
    </section>

    <div class="linkrow">
      <button id="reconnect" style="display: none"></button>
    </div>
    <p class="cert" id="t-cert"></p>
    <div id="scrollFade" aria-hidden="true"></div>

    <script>
      "use strict";
      // Localized strings: injected by the Mac from the SAME companion.*
      // keys the app locales ship. `null` in the raw file; a JSON object here.
      const STRINGS = /*__COMPANION_STRINGS__*/null;

      const S = (function () {
        const langs =
          navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || "en"];
        // Script-aware fallback mirroring the app UI (src/i18n/index.ts) and
        // the tray (tray_i18n.rs): zh-Hant / TW / HK / MO / yue pick the
        // Traditional zh-TW strings, not Simplified zh.
        const resolveTag = (tag) => {
          if (STRINGS[tag]) return STRINGS[tag];
          const subtags = String(tag).toLowerCase().split("-");
          const base = subtags[0];
          let fallback = base;
          if (
            base === "zh" &&
            (subtags.includes("hant") ||
              (!subtags.includes("hans") &&
                ["tw", "hk", "mo"].some((r) => subtags.includes(r))))
          ) {
            fallback = "zh-tw";
          } else if (base === "yue") {
            fallback = subtags.includes("hans") ? "zh" : "zh-tw";
          }
          return STRINGS[fallback] || STRINGS[base];
        };
        for (const tag of langs) {
          if (!tag) continue;
          const resolved = resolveTag(tag);
          if (resolved) return resolved;
        }
        return STRINGS["en"] || {};
      })();
      const t = (key, fallback) => S[key] || fallback || key;

      // ---- DOM ----
      const stateEl = document.getElementById("state");
      const stateText = document.getElementById("stateText");
      const ptt = document.getElementById("ptt");
      const hint = document.getElementById("hint");
      const notice = document.getElementById("notice");
      const reconnectBtn = document.getElementById("reconnect");
      const micbar = document.getElementById("micbar");
      const miclvl = micbar.querySelector(".lvl");
      const meterRow = document.getElementById("meterRow");
      const recTimer = document.getElementById("recTimer");
      const micErrorCard = document.getElementById("micError");
      const micErrorMsg = document.getElementById("micErrorMsg");
      const micRetryBtn = document.getElementById("micRetry");
      const tgtPcBtn = document.getElementById("tgtPc");
      const tgtPhoneBtn = document.getElementById("tgtPhone");
      const ppToggle = document.getElementById("ppToggle");
      const resultCard = document.getElementById("result");
      const resultBadge = document.getElementById("resultBadge");
      const resultModel = document.getElementById("resultModel");
      const resultCopyBtn = document.getElementById("resultCopy");
      const resultTextEl = document.getElementById("resultText");
      const recentCard = document.getElementById("recent");
      const recentList = document.getElementById("recentList");
      const recentEmpty = document.getElementById("recentEmpty");
      const controlsCard = document.getElementById("controls");
      const scrollFade = document.getElementById("scrollFade");

      document.getElementById("t-title").textContent = t(
        "title",
        "VoxBar Companion",
      );
      document.getElementById("t-subtitle").textContent = t("subtitle", "");
      document.getElementById("t-cert").textContent = t("certNote", "");
      reconnectBtn.textContent = t("reconnect", "Reconnect");
      document.getElementById("t-target-label").textContent = t(
        "targetLabel",
        "Send to",
      );
      tgtPcBtn.textContent = t("targetPc", "To PC");
      tgtPhoneBtn.textContent = t("targetPhone", "To Phone");
      document.getElementById("t-pp-label").textContent = t(
        "postProcessLabel",
        "Polish text",
      );
      document.getElementById("t-result-title").textContent = t(
        "resultTitle",
        "Transcript",
      );
      document.getElementById("t-history-title").textContent = t(
        "historyTitle",
        "Recent",
      );
      recentEmpty.textContent = t(
        "historyEmpty",
        "Dictations from this phone appear here.",
      );
      micRetryBtn.textContent = t("micRetry", "Try again");
      resultCopyBtn.textContent = t("copy", "Copy");

      // ---- pairing token from the QR URL (https://lan-ip:port/#t=TOKEN) ----
      const TOKEN = (location.hash.match(/t=([0-9a-fA-F]{32})/) || [])[1] || "";
      const LANG = (navigator.language || "en").slice(0, 16);
      const WS_URL =
        (location.protocol === "https:" ? "wss://" : "ws://") +
        location.host +
        "/ws";

      let ws = null;
      let activation = "push_to_talk"; // set by the Mac from its settings
      let recording = false; // last state the Mac broadcast
      let micStream = null;
      let audioCtx = null;
      var audioNode = null; // AudioWorkletNode or ScriptProcessorNode
      let pressing = false; // is the button held down (client view)
      let deliberateClose = false;

      function setState(cls, text) {
        stateEl.className = cls;
        stateText.textContent = text;
      }
      // ---- recording meter + elapsed timer ----
      // The bar shows the mic level; the timer says how long the session
      // has been live, so the meter row reads as an active recorder
      // instead of an unlabeled purple bar. Starts on the Mac's first
      // recording=true frame, stops and clears on the stop edge.
      let recTimerId = 0;
      let recStartAt = 0;
      function renderRecTimer() {
        const s = Math.max(
          0,
          Math.floor((Date.now() - recStartAt) / 1000),
        );
        recTimer.textContent =
          Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      }
      function startRecTimer() {
        stopRecTimer();
        recStartAt = Date.now();
        renderRecTimer();
        recTimerId = window.setInterval(renderRecTimer, 250);
      }
      function stopRecTimer() {
        if (recTimerId) {
          window.clearInterval(recTimerId);
          recTimerId = 0;
        }
      }
      function setMeter(show) {
        meterRow.classList.toggle("show", show);
        if (show) startRecTimer();
        else stopRecTimer();
      }
      function setHint(text, isError) {
        hint.textContent = text || "";
        hint.classList.toggle("error-banner", !!isError && !!text);
      }
      // The send-to controls only mean something on a live socket: while
      // the pairing is down (error, goodbye, dropped connection) they dim
      // and stop taking taps until a fresh welcome re-enables them.
      function setControlsEnabled(enabled) {
        controlsCard.classList.toggle("offline", !enabled);
        tgtPcBtn.disabled = !enabled;
        tgtPhoneBtn.disabled = !enabled;
        ppToggle.disabled = !enabled;
      }
      // Bottom-edge fade while more content sits below the fold. A sliver
      // of overflow must not light the fade: when the page overflows by
      // less than the band height itself, the band can only ever shade
      // content that is fully on screen (the mic-error state's static
      // footnote read as permanently dimmed). The band only shows when a
      // real chunk of content - more than the 48px band - is hidden, and
      // scrolling to the bottom clears it.
      function refreshScrollFade() {
        const doc = document.documentElement;
        const hidden = doc.scrollHeight - (window.scrollY + window.innerHeight);
        scrollFade.style.opacity = hidden > 48 ? "1" : "0";
      }
      window.addEventListener("scroll", refreshScrollFade, {
        passive: true,
      });
      window.addEventListener("resize", refreshScrollFade);
      function showNotice(text) {
        notice.textContent = text;
        notice.classList.add("show");
        window.setTimeout(() => notice.classList.remove("show"), 6000);
      }
      // KB-262 (v1.6.3): the zero-audio recovery advice must match the
      // activation the Mac actually applies. "Hold the button" is wrong
      // advice in tap-to-lock modes, where the button taps to start and
      // taps again to stop; the client has known `activation` from the
      // welcome frame since v1.6.2, so compose the notice from it. The
      // activation-neutral `zeroAudio` key stays as the fallback.
      function zeroAudioHint() {
        if (activation === "toggle")
          return t("zeroAudioTap", t("zeroAudio", ""));
        if (activation === "hold_or_toggle")
          return t("zeroAudioHoldOrToggle", t("zeroAudio", ""));
        return t("zeroAudioHold", t("zeroAudio", ""));
      }
      function vibrate(ms) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch (e) {}
      }

      function refreshButton() {
        // Mic-blocked is a state, not a disabled control: the caption says
        // so and the next press retries the microphone. While the Mac
        // reports a live session the stop caption wins, so a toggle-mode
        // session can always be ended.
        ptt.classList.toggle("mic-blocked", micFailed && !recording);
        if (micFailed && !recording) {
          ptt.textContent = t("micBlockedRetry", "Mic blocked. Tap to retry");
          ptt.classList.remove("recording");
          return;
        }
        if (activation === "toggle") {
          ptt.textContent = recording
            ? t("tapToStop", "Tap to stop")
            : t("tapToTalk", "Tap to talk");
        } else if (activation === "hold_or_toggle") {
          // v1.6.2 W1-L0: the idle button must name BOTH modes. A bare
          // "hold to talk" hides the tap-to-lock behavior the operator
          // actually uses, so quick taps read as a broken hold button.
          ptt.textContent = recording
            ? t("tapToStop", "Tap to stop")
            : t("holdOrToggleToTalk", "Hold to talk, tap to lock");
        } else {
          ptt.textContent = recording
            ? t("release", "Release to finish")
            : t("holdToTalk", "Hold to talk");
        }
        ptt.classList.toggle("recording", recording);
      }

      // ---- per-session preferences (v1.6.0) ----
      // Where the transcript lands (the Mac pastes it, or this phone shows
      // it) and whether the post-process leg runs. Both ride every Ptt
      // edge, so the server always holds the phone's current choice, and
      // both persist so a reopening phone remembers them.
      const TARGET_KEY = "voxbarCompanion.target";
      const PP_KEY = "voxbarCompanion.postProcess";
      let outputTarget = "pc"; // "pc" | "phone"
      let postProcess = false;

      // ---- device identity (v1.6.2) ----
      // The hello's human name is derived from the user agent and is a
      // PLATFORM token every same-platform phone shares (two iPhones both
      // say "iPhone", every Chrome-Android phone says "Linux"), so it
      // cannot tell this phone from its twin. A random id, persisted like
      // the prefs, can: the Mac pairs it with the name to key this phone's
      // data (the Recent list), so same-platform phones never share one
      // identity.
      const DEVICE_ID_KEY = "voxbarCompanion.deviceId";
      function deviceIdentity() {
        try {
          let id = localStorage.getItem(DEVICE_ID_KEY);
          if (!id) {
            id =
              window.crypto && crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
            localStorage.setItem(DEVICE_ID_KEY, id);
          }
          return id;
        } catch (e) {
          // Storage unavailable (private mode): a per-load random id still
          // separates this phone from its same-platform twin for the
          // session.
          return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        }
      }

      function loadPrefs() {
        try {
          const savedTarget = localStorage.getItem(TARGET_KEY);
          if (savedTarget === "pc" || savedTarget === "phone")
            outputTarget = savedTarget;
          const savedPp = localStorage.getItem(PP_KEY);
          if (savedPp === "1" || savedPp === "0")
            postProcess = savedPp === "1";
        } catch (e) {}
      }
      function savePrefs() {
        try {
          localStorage.setItem(TARGET_KEY, outputTarget);
          localStorage.setItem(PP_KEY, postProcess ? "1" : "0");
        } catch (e) {}
      }
      function refreshControls() {
        tgtPcBtn.classList.toggle("active", outputTarget === "pc");
        tgtPhoneBtn.classList.toggle("active", outputTarget === "phone");
        tgtPcBtn.setAttribute("aria-pressed", String(outputTarget === "pc"));
        tgtPhoneBtn.setAttribute(
          "aria-pressed",
          String(outputTarget === "phone"),
        );
        ppToggle.classList.toggle("on", postProcess);
        ppToggle.setAttribute("aria-checked", String(postProcess));
      }
      tgtPcBtn.addEventListener("click", () => {
        outputTarget = "pc";
        savePrefs();
        refreshControls();
      });
      tgtPhoneBtn.addEventListener("click", () => {
        outputTarget = "phone";
        savePrefs();
        refreshControls();
      });
      ppToggle.addEventListener("click", () => {
        postProcess = !postProcess;
        savePrefs();
        refreshControls();
      });

      // ---- transcript delivery to the phone (target: phone) ----
      let lastTranscript = null; // { text, polished, model }
      let flashTimer = 0;

      function copyText(text, btn) {
        if (!text) return;
        // clipboard.writeText called from a click handler carries the
        // gesture the platform requires; the automatic attempt right after
        // a transcript frame may be refused, and then this button (or the
        // recent-list copy buttons) is the reliable path.
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => {
              if (btn) flashCopied(btn);
            },
            () => {},
          );
        }
      }
      function flashCopied(btn) {
        const orig = btn.getAttribute("data-label") || btn.textContent;
        btn.setAttribute("data-label", orig);
        btn.textContent = t("copied", "Copied");
        btn.classList.add("copied");
        window.clearTimeout(flashTimer);
        flashTimer = window.setTimeout(() => {
          btn.textContent = orig;
          btn.classList.remove("copied");
        }, 1500);
      }

      function showTranscript(text, polished, model) {
        if (!text) return;
        lastTranscript = { text: text, polished: !!polished, model: model };
        resultTextEl.textContent = text;
        resultBadge.textContent = t("polished", "Polished");
        resultBadge.style.display = polished ? "" : "none";
        resultModel.textContent = model || "";
        resultModel.style.display = model ? "" : "none";
        resultCopyBtn.textContent = t("copy", "Copy");
        resultCard.classList.add("show");
        refreshScrollFade();
        // Auto-copy where the platform allows a write outside a gesture;
        // where it does not, the Copy button above does it inside the tap.
        copyText(text, resultCopyBtn);
      }
      resultCopyBtn.addEventListener("click", () => {
        if (lastTranscript) copyText(lastTranscript.text, resultCopyBtn);
      });

      // ---- recent companion history (last 5, newest first) ----
      const RECENT_LIMIT = 5;
      let recentEntries = [];
      let recentReceived = false; // the section waits for the first frame

      function fmtTime(ts) {
        if (!ts) return "";
        try {
          return new Date(ts * 1000).toLocaleString(undefined, {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch (e) {
          return "";
        }
      }
      function renderRecent() {
        if (!recentReceived) return;
        recentCard.classList.add("show");
        recentList.textContent = "";
        recentEmpty.style.display = recentEntries.length ? "none" : "";
        refreshScrollFade();
        recentEntries.forEach((entry, idx) => {
          const li = document.createElement("li");
          li.className = "recent-item";
          const body = document.createElement("div");
          body.className = "recent-body";
          const txt = document.createElement("div");
          txt.className = "recent-text";
          txt.textContent = entry.text;
          const time = document.createElement("div");
          time.className = "recent-time";
          time.textContent = fmtTime(entry.timestamp);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "copy-mini";
          btn.textContent = t("copy", "Copy");
          btn.setAttribute("data-idx", String(idx));
          body.appendChild(txt);
          body.appendChild(time);
          li.appendChild(body);
          li.appendChild(btn);
          recentList.appendChild(li);
        });
      }
      recentList.addEventListener("click", (ev) => {
        const btn = ev.target.closest("button.copy-mini");
        if (!btn) return;
        const entry = recentEntries[Number(btn.getAttribute("data-idx"))];
        if (entry) copyText(entry.text, btn);
      });

      // ---- WebSocket ----
      function connect() {
        deliberateClose = false;
        setState("connecting", t("stateConnecting", "Connecting"));
        ptt.disabled = true;
        setHint("");
        reconnectBtn.style.display = "none";

        if (!TOKEN) {
          setState("error", t("stateError", "Error"));
          setHint(
            t("noToken", "Open this page from the QR code in VoxBar settings."),
            true,
          );
          setControlsEnabled(false);
          return;
        }

        let socket;
        try {
          socket = new WebSocket(WS_URL);
        } catch (e) {
          setState("error", t("stateError", "Error"));
          setHint(String((e && e.message) || e), true);
          setControlsEnabled(false);
          return;
        }
        socket.binaryType = "arraybuffer";
        ws = socket;

        socket.onopen = () => {
          socket.send(
            JSON.stringify({
              type: "hello",
              token: TOKEN,
              device:
                (navigator.userAgent.match(/\(([^)]+)/) || [, "Phone"])[1]
                  .split(";")[0]
                  .trim()
                  .slice(0, 48) || "Phone",
              deviceId: deviceIdentity(),
              lang: LANG,
            }),
          );
          setState("waiting", t("stateWaitMic", "Waiting for microphone"));
        };
        socket.onmessage = (ev) => {
          let msg = null;
          try {
            msg = JSON.parse(typeof ev.data === "string" ? ev.data : "");
          } catch (e) {
            return;
          }
          if (!msg || typeof msg !== "object") return;
          switch (msg.type) {
            case "welcome":
              activation = msg.activation || "push_to_talk";
              recording = !!msg.recording;
              ptt.disabled = false;
              setControlsEnabled(true);
              setState("ready", t("stateReady", "Ready"));
              // The caption stays empty in the default mode: the button
              // right above already names its activation modes (W1-L0's
              // activation-aware label), and repeating it within ~40px was
              // noise. The caption is reserved for state-conditional
              // guidance (mic errors, pairing failures, disconnect
              // reasons).
              setHint("");
              refreshButton();
              // Warm the microphone (permission prompt, stream) but NEVER
              // the AudioContext: it is created and resumed inside the
              // press gesture, or engines that start it suspended
              // (iOS Safari autoplay policy) capture silence forever.
              openMic();
              break;
            case "state":
              recording = !!msg.recording;
              // Back to idle: the pill returns to Ready only when the
              // microphone actually works; a blocked mic keeps the amber
              // "Mic blocked" pill instead of re-asserting readiness.
              if (recording) {
                setState("recording", t("stateRecording", "Recording"));
              } else if (micFailed) {
                setState("warn", t("stateMicBlocked", "Mic blocked"));
              } else {
                setState("ready", t("stateReady", "Ready"));
              }
              setHint("");
              setMeter(recording);
              if (!recording) {
                pressing = false;
                ptt.classList.remove("held");
              }
              refreshButton();
              vibrate(recording ? 40 : 20);
              break;
            case "notice":
              vibrate(30);
              if (msg.code === "binding_busy") showNotice(t("busy", ""));
              else if (msg.code === "companion_disconnected_finalized")
                showNotice(t("disconnectedFinalized", ""));
              else if (msg.code === "companion_session_capped")
                showNotice(t("capped", ""));
              else if (msg.code === "companion_zero_audio")
                showNotice(zeroAudioHint());
              break;
            case "transcript":
              // Phone-target delivery: the Mac skipped its paste and sent
              // the final transcript here instead.
              vibrate(30);
              showTranscript(
                typeof msg.text === "string" ? msg.text : "",
                !!msg.postProcessed,
                typeof msg.model === "string" ? msg.model : "",
              );
              break;
            case "recentHistory":
              if (Array.isArray(msg.entries)) {
                recentEntries = msg.entries
                  .filter((e) => e && typeof e.text === "string")
                  .slice(0, RECENT_LIMIT)
                  .map((e) => ({
                    text: e.text,
                    timestamp: Number(e.timestamp) || 0,
                  }));
                recentReceived = true;
                renderRecent();
              }
              break;
            case "error":
              deliberateClose = true;
              ptt.disabled = true;
              setState("error", t("stateError", "Error"));
              if (msg.code === "bad_token") setHint(t("badToken", ""), true);
              else if (msg.code === "wrong_subnet")
                setHint(t("wrongSubnet", ""), true);
              else if (msg.code === "rate_limited")
                setHint(t("rateLimited", ""), true);
              else setHint(msg.code || "", true);
              setControlsEnabled(false);
              try {
                socket.close();
              } catch (e) {}
              reconnectBtn.style.display = "";
              break;
            case "goodbye":
              deliberateClose = true;
              ptt.disabled = true;
              setState("warn", t("stateDisconnected", "Disconnected"));
              if (msg.reason === "server_stopping")
                setHint(t("serverStopped", ""));
              else if (msg.reason === "rate_cap") setHint(t("rateLimited", ""));
              else setHint("");
              setControlsEnabled(false);
              stopMic();
              reconnectBtn.style.display = "";
              break;
          }
        };

        socket.onclose = () => {
          ptt.disabled = true;
          setMeter(false);
          stopMic();
          setControlsEnabled(false);
          if (deliberateClose) return;
          setState("warn", t("stateDisconnected", "Disconnected"));
          setHint("");
          reconnectBtn.style.display = "";
        };
        socket.onerror = () => {
          /* onclose follows */
        };
      }

      reconnectBtn.addEventListener("click", connect);

      // ---- microphone capture (AudioWorklet, ScriptProcessorNode fallback) ----
      const TARGET_RATE = 16000;
      const CHUNK = 640; // 40 ms of 16 kHz mono
      let lastLevelAt = 0;
      let micFailed = false;
      let openMicPromise = null;
      let graphBuilding = false;
      let workletUrl = null;

      function showMicError() {
        micErrorMsg.textContent = t(
          "micDenied",
          "Microphone access failed. Allow it in the browser, then try again.",
        );
        micErrorCard.classList.add("show");
        // State consistency: a failed microphone must never leave a green
        // "Ready" pill above the failure banner. The pill goes amber until
        // the mic is granted again (hideMicError).
        if (!recording) {
          setState("warn", t("stateMicBlocked", "Mic blocked"));
        }
        refreshButton();
        refreshScrollFade();
      }
      function hideMicError() {
        micErrorCard.classList.remove("show");
        if (!recording) {
          setState("ready", t("stateReady", "Ready"));
        }
        refreshButton();
        refreshScrollFade();
      }

      function openMic() {
        // Acquires (or reacquires after stopMic) the microphone stream.
        // Safe from any context: a gesture, the welcome handler, or the
        // retry button. The AudioContext is NOT touched here.
        if (micStream) return Promise.resolve(micStream);
        if (openMicPromise) return openMicPromise;
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          micFailed = true;
          showMicError();
          return Promise.reject(new Error("no mediaDevices"));
        }
        openMicPromise = navigator.mediaDevices
          .getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              channelCount: 1,
            },
            video: false,
          })
          .then((stream) => {
            // A grant that lands AFTER the page tore the mic down (goodbye or
            // socket loss ran stopMic while the permission prompt was up)
            // must not resurrect live hardware on a dead page: reap it
            // immediately instead of keeping the mic-in-use indicator lit.
            if (deliberateClose || !ws || ws.readyState !== WebSocket.OPEN) {
              for (const track of stream.getTracks()) track.stop();
              return stream;
            }
            micStream = stream;
            micFailed = false;
            openMicPromise = null;
            hideMicError();
            if (audioCtx) setupGraph(stream);
            return stream;
          })
          .catch(() => {
            openMicPromise = null;
            micFailed = true;
            // Inline error with a retry; the talk button stays alive and
            // its next press retries the microphone too.
            showMicError();
            throw new Error("getUserMedia failed");
          });
        return openMicPromise;
      }
      micRetryBtn.addEventListener("click", () => {
        openMic().catch(() => {});
      });

      function ensureAudio() {
        // MUST run inside the pointerdown/touchstart gesture: engines that
        // start AudioContexts suspended (iOS Safari autoplay policy) only
        // run the capture graph after a create-or-resume made inside the
        // gesture, and a resume made outside one stays rejected. Rebuilt
        // here too, so a graph torn down between sessions (stopMic on
        // goodbye/disconnect) comes back inside the next press.
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) {
            micFailed = true;
            showMicError();
            return;
          }
          try {
            audioCtx = new Ctx({ sampleRate: TARGET_RATE });
          } catch (e) {
            micFailed = true;
            showMicError();
            return;
          }
        }
        if (audioCtx.state === "suspended") {
          // A resume the OS refuses leaves the graph silent: the whole session
          // would record nothing and the user would only learn at the
          // end-of-session zero-audio notice, after talking the entire time.
          // Surface it now, exactly like a getUserMedia failure.
          audioCtx.resume().catch(() => {
            micFailed = true;
            showMicError();
          });
        }
        if (!micStream) {
          openMic().catch(() => {});
        } else if (!audioNode) {
          setupGraph(micStream);
        }
      }

      function setupGraph(stream) {
        if (audioNode || graphBuilding || !audioCtx) return;
        const source = audioCtx.createMediaStreamSource(stream);
        const sink = audioCtx.createGain();
        sink.gain.value = 0;
        sink.connect(audioCtx.destination);

        if (audioCtx.audioWorklet) {
          // Linear resample from the context rate to 16 kHz, buffered into
          // 640-sample (40 ms) chunks posted to the main thread.
          graphBuilding = true;
          const blob = new Blob(
            [
              `
      class R extends AudioWorkletProcessor {
        constructor() { super(); this.buf = []; this.pos = 0; this.tail = 0; }
        process(inputs) {
          const input = inputs[0] && inputs[0][0];
          if (input) {
            const ratio = sampleRate / ${TARGET_RATE};
            let pos = this.pos, tail = this.tail;
            const emit = (v) => {
              this.buf.push(v);
              if (this.buf.length >= ${CHUNK}) {
                this.port.postMessage(this.buf.slice(0, ${CHUNK}));
                this.buf = this.buf.slice(${CHUNK});
              }
            };
            // RESAMPLER-CORE-WORKLET-START (v1.6.3: pinned by
            // src/lib/companionResampler.test.ts - edit both cores together)
            while (pos < input.length - 1) {
              const i0 = Math.floor(pos), frac = pos - i0;
              // i0 is -1 exactly once per block boundary: the residual
              // folded the previous block's FINAL sample forward (the
              // v1.6.2 core read input[-1] there and emitted a NaN every
              // 128 samples, which silenced the whole stream server-side).
              const a = i0 >= 0 ? input[i0] : tail,
                b = input[Math.min(i0 + 1, input.length - 1)];
              let v = a + (b - a) * frac;
              if (!Number.isFinite(v)) v = 0;
              emit(v);
              pos += ratio;
            }
            pos -= input.length;
            tail = input[input.length - 1];
            // RESAMPLER-CORE-WORKLET-END
            this.pos = pos;
            this.tail = tail;
          }
          return true;
        }
      }
      registerProcessor("r", R);`,
            ],
            { type: "application/javascript" },
          );
          workletUrl = URL.createObjectURL(blob);
          audioCtx.audioWorklet
            .addModule(workletUrl)
            .then(() => {
              graphBuilding = false;
              URL.revokeObjectURL(workletUrl);
              workletUrl = null;
              if (audioNode || !audioCtx) return;
              audioNode = new AudioWorkletNode(audioCtx, "r", {
                numberOfOutputs: 1,
              });
              audioNode.port.onmessage = (ev) => sendChunk(ev.data);
              source.connect(audioNode);
              audioNode.connect(sink);
            })
            .catch(() => {
              graphBuilding = false;
              URL.revokeObjectURL(workletUrl);
              workletUrl = null;
              scriptProcessorFallback(source, sink);
            });
        } else {
          scriptProcessorFallback(source, sink);
        }
      }

      function scriptProcessorFallback(source, sink) {
        const buf = [];
        let pos = 0;
        let tail = 0;
        const ratioHolder = {
          ratio:
            (audioCtx && audioCtx.sampleRate
              ? audioCtx.sampleRate
              : TARGET_RATE) / TARGET_RATE,
        };
        audioNode = audioCtx.createScriptProcessor(4096, 1, 1);
        audioNode.onaudioprocess = (ev) => {
          const input = ev.inputBuffer.getChannelData(0);
          const ratio = ratioHolder.ratio;
          const emit = (v) => {
            buf.push(v);
            if (buf.length >= CHUNK) {
              sendChunk(buf.splice(0, CHUNK));
            }
          };
          // RESAMPLER-CORE-FALLBACK-START (v1.6.3: pinned by
          // src/lib/companionResampler.test.ts - edit both cores together)
          while (pos < input.length - 1) {
            const i0 = Math.floor(pos),
              frac = pos - i0;
            // i0 is -1 exactly once per block boundary: the residual
            // folded the previous block's FINAL sample forward (the
            // v1.6.2 core read input[-1] there and emitted a NaN every
            // 128 samples, which silenced the whole stream server-side).
            const a = i0 >= 0 ? input[i0] : tail,
              b = input[Math.min(i0 + 1, input.length - 1)];
            let v = a + (b - a) * frac;
            if (!Number.isFinite(v)) v = 0;
            emit(v);
            pos += ratio;
          }
          pos -= input.length;
          tail = input[input.length - 1];
          // RESAMPLER-CORE-FALLBACK-END
        };
        source.connect(audioNode);
        audioNode.connect(sink);
      }

      function sendChunk(samples) {
        if (!samples || !samples.length) return;
        // The meter must reflect SENT audio, never captured audio: a
        // closed gate (socket down, Mac not reporting a live session)
        // decays the bar to empty and dims it, so the phone can never
        // again show a lively meter over a stream nobody receives.
        const live = !!(ws && ws.readyState === WebSocket.OPEN && recording);
        const now = performance.now();
        if (now - lastLevelAt > 90) {
          lastLevelAt = now;
          if (live) {
            // Peak over EVERY sample: the old stride-8 sampling was
            // structurally blind to the per-128 NaNs this cycle fixed.
            let peak = 0;
            for (let i = 0; i < samples.length; i++) {
              const v = Math.abs(samples[i]);
              if (Number.isFinite(v) && v > peak) peak = v;
            }
            miclvl.classList.remove("dim");
            miclvl.style.width = Math.min(100, Math.round(peak * 220)) + "%";
          } else {
            miclvl.classList.add("dim");
            miclvl.style.width = "0%";
          }
        }
        if (live) {
          const view = new Float32Array(samples);
          ws.send(view.buffer);
        }
      }

      function stopMic() {
        // Full teardown when the connection is gone (goodbye, error,
        // network drop): releases the microphone hardware. The next press
        // rebuilds everything inside its own gesture (ensureAudio), and
        // between sessions the graph is NEVER torn down, so back-to-back
        // dictations reuse it.
        if (audioNode) {
          try {
            audioNode.disconnect();
          } catch (e) {}
          audioNode = null;
        }
        graphBuilding = false;
        if (workletUrl) {
          try {
            URL.revokeObjectURL(workletUrl);
          } catch (e) {}
          workletUrl = null;
        }
        if (audioCtx) {
          try {
            audioCtx.close();
          } catch (e) {}
          audioCtx = null;
        }
        if (micStream) {
          for (const track of micStream.getTracks()) track.stop();
          micStream = null;
        }
        setMeter(false);
      }

      // ---- PTT edges ----
      function pressStart(ev) {
        if (ev) ev.preventDefault();
        if (ptt.disabled || pressing) return;
        ensureAudio();
        if (micFailed && !recording) {
          // A session with no microphone is a guaranteed zero-audio
          // capture; this press retries the microphone instead. The
          // button stays alive, never dead. The gate only blocks a NEW
          // session: while the Mac reports a live session (recording),
          // this press is the STOP edge in toggle mode - the start-tap
          // passed this gate while getUserMedia was still pending, and
          // swallowing the stop here would strand the Mac's locked
          // session until the 15-minute cap.
          return;
        }
        pressing = true;
        ptt.classList.add("held");
        vibrate(15);
        // Every tap sends a PRESS edge. In toggle mode a press toggles the
        // locked session (first tap starts, the next stops); a release edge
        // would be ignored by the Mac by design. In the hold modes the
        // press starts the session and pressEnd below sends the release.
        sendPtt(true);
      }
      function pressEnd(ev) {
        if (ev && ev.cancelable) ev.preventDefault();
        if (!pressing) return;
        pressing = false;
        ptt.classList.remove("held");
        if (activation === "push_to_talk") {
          sendPtt(false); // every release stops
        }
        // toggle: release never stops. hold_or_toggle: the Mac classifies.
        if (activation === "hold_or_toggle") {
          sendPtt(false);
        }
      }

      function sendPtt(pressed) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          // The per-session preferences ride EVERY edge (v1.6.0): the
          // server folds them in as they arrive and snaps them up on the
          // press that starts a session, so a reconnecting phone re-arms
          // its choice without any extra frame.
          ws.send(
            JSON.stringify({
              type: "ptt",
              pressed: !!pressed,
              target: outputTarget,
              postProcess: postProcess,
            }),
          );
        }
      }

      // ONE edge source. Mobile engines can fire a single physical tap as
      // pointerdown, pointerup, THEN touchstart, touchend (the pressing
      // guard resets on pointerup, so the late touchstart passes it) - two
      // full press cycles per tap, which in toggle mode starts and instantly
      // stops the session while the caller keeps talking into a dead
      // recorder (the zero-audio notice then fires on a session the user
      // never intended to end). Pointer events drive the button wherever
      // they exist; touch handlers only suppress the iOS long-press
      // callout, and legacy engines without pointer events fall back to
      // touch-driven edges so the button still works there.
      const hasPointerEvents = !!window.PointerEvent;
      if (hasPointerEvents) {
        ptt.addEventListener("pointerdown", pressStart);
        ptt.addEventListener("pointerup", pressEnd);
        ptt.addEventListener("pointercancel", pressEnd);
        ptt.addEventListener("pointerleave", pressEnd);
        ptt.addEventListener("touchstart", (ev) => ev.preventDefault(), {
          passive: false,
        });
      } else {
        ptt.addEventListener(
          "touchstart",
          (ev) => {
            ev.preventDefault();
            pressStart();
          },
          { passive: false },
        );
        ptt.addEventListener(
          "touchend",
          (ev) => {
            ev.preventDefault();
            pressEnd();
          },
          { passive: false },
        );
        ptt.addEventListener("touchcancel", () => pressEnd());
      }
      ptt.addEventListener("contextmenu", (ev) => ev.preventDefault());
      // Pinch-zoom stays available (WCAG 1.4.4): the viewport meta no
      // longer caps the scale, and no gesture blocker runs here.
      // touch-action: manipulation on body still suppresses the accidental
      // double-tap zoom around the talk button without touching pinch.

      document.addEventListener("visibilitychange", () => {
        // Backgrounded mid-press: treat as release so audio never leaks on.
        if (document.hidden && pressing) {
          pressing = false;
          ptt.classList.remove("held");
          sendPtt(false);
        }
      });

      loadPrefs();
      refreshControls();
      refreshButton();
      connect();
      refreshScrollFade();
    </script>
  </body>
</html>
